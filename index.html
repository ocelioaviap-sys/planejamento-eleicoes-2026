<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5W2H - Planejamento Eleições 2026 (COLABORATIVO)</title>
    
    <!-- Bibliotecas de Gráficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    
    <!-- SDKs do Firebase (Versão Compatibilidade para facilitar) -->
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

    <style>
        /* O estilo original foi mantido integralmente */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; color: #333; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .header { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-radius: 20px; padding: 30px; margin-bottom: 30px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1); text-align: center; }
        .header h1 { color: #2c3e50; font-size: 2.5rem; margin-bottom: 10px; background: linear-gradient(45deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .tabs { display: flex; background: rgba(255, 255, 255, 0.9); border-radius: 15px; padding: 10px; margin-bottom: 30px; overflow-x: auto; }
        .tab { flex: 1; padding: 15px 25px; border: none; border-radius: 10px; cursor: pointer; font-weight: 600; transition: all 0.3s ease; white-space: nowrap; }
        .tab.active { background: linear-gradient(45deg, #667eea, #764ba2); color: white; box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4); }
        .tab-content { display: none; background: rgba(255, 255, 255, 0.95); border-radius: 20px; padding: 30px; animation: fadeIn 0.5s ease; }
        .tab-content.active { display: block; }
        .section { background: #f8f9fa; border-radius: 15px; margin-bottom: 25px; overflow: hidden; box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08); }
        .section-header { background: linear-gradient(45deg, #667eea, #764ba2); color: white; padding: 20px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .section-content { padding: 25px; }
        .activity-card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 3px 10px rgba(0,0,0,0.1); border-left: 4px solid #667eea; }
        .activity-fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 15px; }
        .field-group { display: flex; flex-direction: column; }
        .field-label { font-weight: 600; color: #2c3e50; font-size: 0.85rem; text-transform: uppercase; margin-bottom: 5px; }
        .field-input { padding: 8px 12px; border: 1px solid #dee2e6; border-radius: 6px; font-size: 0.9rem; }
        .btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; text-transform: uppercase; transition: 0.3s; }
        .btn-primary { background: linear-gradient(45deg, #667eea, #764ba2); color: white; }
        .progress-bar { background: #e9ecef; border-radius: 10px; height: 8px; margin: 20px 0; overflow: hidden; }
        .progress-fill { background: linear-gradient(45deg, #667eea, #764ba2); height: 100%; transition: width 0.5s; }
        .sync-indicator { position: fixed; top: 10px; right: 10px; padding: 5px 15px; border-radius: 20px; font-size: 0.8rem; display: none; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="syncStatus" class="sync-indicator btn-primary">🔄 Sincronizando...</div>

    <div class="container">
        <div class="header">
            <h1>5W2H - Planejamento Eleições 2026</h1>
            <p>Acesso Colaborativo via Firebase</p>
            <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width: 0%"></div></div>
            <div id="progressText">0% concluído</div>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="showTab('planejamento', event)">📋 Planejamento</button>
            <button class="tab" onclick="showTab('dashboard', event)">📊 Dashboard</button>
        </div>

        <div id="planejamento" class="tab-content active">
            <div id="sectionsContainer">
                <!-- Conteúdo gerado dinamicamente -->
            </div>
            <div style="margin-top: 20px;">
                <button class="btn btn-primary" onclick="pushToFirebase()">💾 Salvar Alterações para Todos</button>
            </div>
        </div>

        <div id="dashboard" class="tab-content">
            <div class="chart-container">
                <canvas id="statusChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        // 1. CONFIGURAÇÃO DO SEU FIREBASE (COLE SEUS DADOS AQUI)
        const firebaseConfig = {
            apiKey: "SUA_API_KEY",
            authDomain: "SEU_PROJETO.firebaseapp.com",
            databaseURL: "https://SEU_PROJETO-default-rtdb.firebaseio.com",
            projectId: "SEU_PROJETO",
            storageBucket: "SEU_PROJETO.appspot.com",
            messagingSenderId: "ID",
            appId: "ID_APP"
        };

        // Inicializa Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 2. TODAS AS ATIVIDADES ORIGINAIS (CONTEÚDO INTEGRAL)
        const initialSectionsData = [
            {
                "title": "I. DISTRIBUIÇÃO DE MESÁRIOS",
                "elaboracao": "Océlio",
                "activities": [
                    { "what": "Início da utilização do Convoca", "when": "01/julho", "who": "", "priority": "medium", "status": "not-started" },
                    { "what": "Impressão dos relatórios preliminares", "when": "01 e 02/julho", "who": "", "priority": "medium", "status": "not-started" },
                    { "what": "Atualizar dados da zona eleitoral", "when": "01/julho", "who": "", "priority": "medium", "status": "not-started" },
                    { "what": "Escolha de membros das mesas receptoras", "when": "09 a 28 de julho", "who": "", "priority": "medium", "status": "not-started" },
                    { "what": "Cadastrar agregações", "when": "13/julho", "who": "", "priority": "medium", "status": "not-started" },
                    { "what": "Convocação dos membros das mesas receptoras", "when": "14/07 a 28/07", "who": "", "priority": "medium", "status": "not-started" },
                    { "what": "Publicar edital de convocação e nomeação", "when": "07/agosto", "who": "", "priority": "urgent", "status": "not-started" },
                    { "what": "Último dia para designação da localização das mesas", "when": "12/agosto", "who": "", "priority": "medium", "status": "not-started" },
                    { "what": "Apreciação das recusas e reclamações", "when": "14 de agosto", "who": "", "priority": "medium", "status": "not-started" },
                    { "what": "Treinamento Presencial de Multiplicadores", "when": "A definir", "who": "", "priority": "medium", "status": "not-started" },
                    { "what": "Entregar cartas de convocação", "when": "10/08 em diante", "who": "", "priority": "medium", "status": "not-started" },
                    { "what": "Fazer substituição de mesários conforme necessário", "when": "10/08 a 04/10", "who": "", "priority": "medium", "status": "not-started" },
                    { "what": "Treinamento de Mesários", "when": "A definir/08/2026", "who": "", "priority": "medium", "status": "not-started" },
                    { "what": "Entrega de material da eleição para o presidente", "when": "09 a 03 de outubro", "who": "", "priority": "urgent", "status": "not-started" },
                    { "what": "Cadastrar frequência dos mesários na eleição", "when": "06/outubro", "who": "", "priority": "urgent", "status": "not-started" }
                ]
            },
            {
                "title": "II. INSTRUTORES DE MESÁRIOS",
                "elaboracao": "Océlio",
                "activities": [
                    { "what": "Preparar relação de instrutores", "when": "05 a 23/07", "who": "", "priority": "medium", "status": "not-started" },
                    { "what": "Reunião com os instrutores de mesários", "when": "04/08", "who": "", "priority": "medium", "status": "not-started" }
                ]
            },
            {
                "title": "III. LOCAIS DE EVENTO E DE VOTAÇÃO",
                "elaboracao": "Océlio",
                "activities": [
                    { "what": "Vistoria dos locais de votação", "when": "24 a 26/julho", "who": "", "priority": "medium", "status": "not-started" },
                    { "what": "Solicitação de adequações nos locais", "when": "30/julho", "who": "", "priority": "medium", "status": "not-started" }
                ]
            },
            {
                "title": "IV. DELEGADOS DE PRÉDIO",
                "elaboracao": "Océlio",
                "activities": [
                    { "what": "Publicar edital de convocação de delegados", "when": "16/agosto", "who": "", "priority": "medium", "status": "not-started" },
                    { "what": "Reunião com delegados de prédio", "when": "25/agosto", "who": "", "priority": "medium", "status": "not-started" }
                ]
            },
            {
                "title": "V. AUXILIARES DE ELEIÇÃO",
                "elaboracao": "Océlio",
                "activities": [
                    { "what": "Treinamento de auxiliares de eleição", "when": "30/agosto", "who": "", "priority": "medium", "status": "not-started" }
                ]
            },
            {
                "title": "VI. REQUISIÇÃO DE VEÍCULOS PARA A ELEIÇÃO",
                "elaboracao": "Océlio",
                "activities": [
                    { "what": "Levantamento da necessidade de veículos", "when": "15/agosto", "who": "", "priority": "medium", "status": "not-started" },
                    { "what": "Organização da logística de transporte", "when": "01 a 05/outubro", "who": "", "priority": "urgent", "status": "not-started" }
                ]
            },
            {
                "title": "VII. ESCRUTINADORES",
                "elaboracao": "Océlio",
                "activities": [
                    { "what": "Treinamento de escrutinadores", "when": "15/setembro", "who": "", "priority": "medium", "status": "not-started" }
                ]
            },
            {
                "title": "VIII. JUNTA ELEITORAL",
                "elaboracao": "Océlio",
                "activities": [
                    { "what": "Funcionamento da Junta no dia da eleição", "when": "06/outubro", "who": "", "priority": "urgent", "status": "not-started" }
                ]
            },
            {
                "title": "IX. DISTRIBUIÇÃO DAS URNAS ELETRÔNICAS",
                "elaboracao": "Océlio",
                "activities": [
                    { "what": "Teste e preparação das urnas", "when": "21 a 30/setembro", "who": "", "priority": "urgent", "status": "not-started" },
                    { "what": "Distribuição das urnas", "when": "04 a 05/outubro", "who": "", "priority": "urgent", "status": "not-started" },
                    { "what": "Recolhimento das urnas pós-eleição", "when": "06 a 07/outubro", "who": "", "priority": "urgent", "status": "not-started" }
                ]
            }
        ];

        let currentData = [];

        // 3. LOGICA DE SINCRONIZAÇÃO
        function initSync() {
            const dataRef = db.ref('planejamento_2026');
            
            // Escuta mudanças em tempo real (quando alguém salva, atualiza para todos)
            dataRef.on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    currentData = data;
                } else {
                    currentData = initialSectionsData;
                    dataRef.set(currentData);
                }
                renderSections();
                updateProgress();
            });
        }

        function pushToFirebase() {
            const indicator = document.getElementById('syncStatus');
            indicator.style.display = 'block';
            
            db.ref('planejamento_2026').set(currentData)
                .then(() => {
                    setTimeout(() => indicator.style.display = 'none', 1000);
                    alert("Dados salvos na nuvem! Seus colaboradores verão as mudanças ao atualizar a página.");
                });
        }

        // 4. LOGICA DA INTERFACE
        function renderSections() {
            const container = document.getElementById('sectionsContainer');
            container.innerHTML = '';

            currentData.forEach((section, sIdx) => {
                const secDiv = document.createElement('div');
                secDiv.className = 'section';
                secDiv.innerHTML = `
                    <div class="section-header" onclick="this.nextElementSibling.style.display = (this.nextElementSibling.style.display === 'none' ? 'block' : 'none')">
                        <h3>${section.title}</h3>
                        <span>▼</span>
                    </div>
                    <div class="section-content">
                        <div class="activities-grid">
                            ${section.activities.map((act, aIdx) => `
                                <div class="activity-card">
                                    <div class="activity-fields">
                                        <div class="field-group" style="grid-column: span 2">
                                            <label class="field-label">O QUE?</label>
                                            <input type="text" class="field-input" value="${act.what}" onchange="updateVal(${sIdx}, ${aIdx}, 'what', this.value)">
                                        </div>
                                        <div class="field-group">
                                            <label class="field-label">QUANDO?</label>
                                            <input type="text" class="field-input" value="${act.when}" onchange="updateVal(${sIdx}, ${aIdx}, 'when', this.value)">
                                        </div>
                                        <div class="field-group">
                                            <label class="field-label">STATUS</label>
                                            <select class="field-input" onchange="updateVal(${sIdx}, ${aIdx}, 'status', this.value)">
                                                <option value="not-started" ${act.status === 'not-started' ? 'selected' : ''}>Pendente</option>
                                                <option value="in-progress" ${act.status === 'in-progress' ? 'selected' : ''}>Em Andamento</option>
                                                <option value="completed" ${act.status === 'completed' ? 'selected' : ''}>Concluído</option>
                                            </select>
                                        </div>
                                        <div class="field-group">
                                            <label class="field-label">QUEM?</label>
                                            <input type="text" class="field-input" value="${act.who || ''}" onchange="updateVal(${sIdx}, ${aIdx}, 'who', this.value)">
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
                container.appendChild(secDiv);
            });
        }

        function updateVal(sIdx, aIdx, field, val) {
            currentData[sIdx].activities[aIdx][field] = val;
            updateProgress();
        }

        function updateProgress() {
            let total = 0, done = 0;
            currentData.forEach(s => s.activities.forEach(a => {
                total++;
                if (a.status === 'completed') done++;
            }));
            const perc = total > 0 ? (done / total) * 100 : 0;
            document.getElementById('progressFill').style.width = perc + '%';
            document.getElementById('progressText').innerText = Math.round(perc) + '% concluído';
        }

        function showTab(tabName, event) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }

        // Início
        initSync();
    </script>
</body>
</html>
